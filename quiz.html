<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>티끌모아 - 소비 유형 진단</title>
  <style>
    :root {
      --bg: #f4f4f6;
      --card: #ffffff;
      --text: #141414;
      --sub: #666;
      --line: #e4e4e8;
      --blue: #2f66e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
    }
    .screen { display: none; min-height: 100vh; padding: 32px 20px 40px; }
    .screen.active { display: flex; flex-direction: column; }

    /* 랜딩 */
    .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 48px; }
    .hero { font-size: 26px; font-weight: 900; line-height: 1.28; letter-spacing: -1.2px; margin-bottom: 14px; }
    .hero .accent { color: var(--blue); }
    .hero-sub { font-size: 16px; color: #444; line-height: 1.55; margin-bottom: 40px; }
    .cta { display: block; width: 100%; padding: 18px; background: #141414; color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; cursor: pointer; letter-spacing: -0.3px; }
    .cta-note { text-align: center; font-size: 13px; color: #aaa; margin-top: 12px; }

    /* 소득 + 퀴즈 공통 */
    .progress-wrap { margin-bottom: 32px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; font-weight: 600; margin-bottom: 8px; }
    .progress-bar { height: 4px; background: #e4e4e8; border-radius: 2px; }
    .progress-fill { height: 4px; background: #141414; border-radius: 2px; transition: width 0.4s ease; }
    .q-label { font-size: 13px; color: #aaa; font-weight: 600; margin-bottom: 8px; }
    .q-text { font-size: 22px; font-weight: 900; letter-spacing: -1.1px; line-height: 1.28; margin-bottom: 8px; }
    .q-sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    .options { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .opt-btn {
      padding: 16px 18px;
      background: #fff;
      color: #333;
      border: 1.5px solid #e4e4e8;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      letter-spacing: -0.2px;
      line-height: 1.4;
    }
    .opt-btn.selected {
      background: #141414;
      color: #fff;
      border-color: #141414;
      font-weight: 700;
    }
    .next-btn {
      margin-top: 24px;
      width: 100%;
      padding: 16px;
      background: #e4e4e8;
      color: #aaa;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: not-allowed;
      transition: all 0.2s ease;
    }
    .next-btn.enabled {
      background: #141414;
      color: #fff;
      cursor: pointer;
    }

    /* 결과 */
    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    .result-headline {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.38;
      letter-spacing: -1px;
      margin-bottom: 8px;
      white-space: pre-line;
    }
    .result-desc { font-size: 15px; color: #777; line-height: 1.6; margin-bottom: 22px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat-box { border-radius: 12px; padding: 14px; }
    .stat-box-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.75; }
    .stat-box-value { font-size: 20px; font-weight: 900; }
    .stat-box-sub { font-size: 11px; opacity: 0.6; margin-top: 2px; }
    .source-row { font-size: 10px; color: #bbb; margin-bottom: 18px; padding: 0 2px; }
    .tip-box { border-left: 3px solid; padding-left: 14px; margin-bottom: 24px; }
    .tip-label { font-size: 11px; color: #aaa; font-weight: 600; margin-bottom: 4px; }
    .tip-text { font-size: 14px; color: #444; line-height: 1.6; }
    .result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 16px; }
    .btn-sim {
      width: 100%;
      padding: 16px;
      background: #141414;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: -0.2px;
    }
    .btn-share {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: #555;
      border: 1.5px solid #e4e4e8;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-retry {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #aaa;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    .copied-toast {
      text-align: center;
      font-size: 13px;
      color: #2f66e3;
      font-weight: 700;
      height: 20px;
      margin-top: -4px;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- 랜딩 -->
  <div class="screen active" id="s-landing">
    <div class="logo">티끌모아 🪙</div>
    <div class="hero">내 소비 유형,<br /><span class="accent">얼마나 새고 있을까요?</span></div>
    <div class="hero-sub">5가지 질문으로 소비 패턴을 진단하고<br />실제 데이터 기반 기회비용을 확인해보세요.</div>
    <button class="cta" id="startBtn">진단 시작하기 →</button>
    <div class="cta-note">약 30초 · 5가지 질문</div>
  </div>

  <!-- 소득 -->
  <div class="screen" id="s-income">
    <div class="progress-wrap">
      <div class="progress-meta"><span>1 / 5</span><span>0%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="q-text">월 소득이 어느 정도예요?</div>
    <div class="q-sub">결과 개인화에 사용돼요. 세후 기준이에요.</div>
    <div class="options" id="income-options">
      <button class="opt-btn" data-income="250">200만원대</button>
      <button class="opt-btn" data-income="350">300만원대</button>
      <button class="opt-btn" data-income="450">400만원대</button>
      <button class="opt-btn" data-income="550">500만원 이상</button>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div class="screen" id="s-quiz">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="q-counter">Q2 / 5</span>
        <span id="q-pct">20%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="q-fill" style="width:20%"></div></div>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
    <button class="next-btn" id="nextBtn">다음 →</button>
  </div>

  <!-- 결과 -->
  <div class="screen" id="s-result">
    <div id="result-badge" class="result-badge"></div>
    <div id="result-headline" class="result-headline"></div>
    <div id="result-desc" class="result-desc"></div>
    <div class="stat-grid" id="stat-grid"></div>
    <div class="source-row" id="source-row"></div>
    <div class="tip-box" id="tip-box">
      <div class="tip-label">이렇게 해보면 어때요?</div>
      <div class="tip-text" id="tip-text"></div>
    </div>
    <div class="result-actions">
      <button class="btn-sim" id="simBtn">내 자산 시뮬레이션 해보기 →</button>
      <button class="btn-share" id="shareBtn">결과 공유하기</button>
      <div class="copied-toast" id="toast"></div>
      <button class="btn-retry" id="retryBtn">다시 진단하기</button>
    </div>
  </div>

</div>
<script>
const QUESTIONS = [
  {
    q: "월급날 제일 먼저 하는 건?",
    opts: [
      { text: "쓰고 싶은 거 먼저 삼", scores: { impulse: 2, delivery: 1 } },
      { text: "적금 먼저 넣고 나머지로 생활", scores: { saver: 3 } },
      { text: "딱히 계획 없이 그냥 씀", scores: { unplanned: 3 } },
      { text: "고정비·구독 정산부터", scores: { subscription: 2, latte: 1 } },
    ]
  },
  {
    q: "퇴근 후 가장 자주 하는 행동은?",
    opts: [
      { text: "카페 들러서 음료 한 잔", scores: { latte: 3 } },
      { text: "앱 열어서 배달 주문", scores: { delivery: 3 } },
      { text: "쇼핑몰 구경하다 결제", scores: { impulse: 3 } },
      { text: "집에서 넷플릭스·유튜브", scores: { subscription: 3 } },
    ]
  },
  {
    q: "스트레스 받을 때 주로?",
    opts: [
      { text: "카페 가서 비싼 음료 마심", scores: { latte: 3 } },
      { text: "맛있는 거 시켜 먹음", scores: { delivery: 3 } },
      { text: "쇼핑몰 열어서 결제함", scores: { impulse: 3 } },
      { text: "그냥 참거나 딱히 없음", scores: { saver: 2, unplanned: 1 } },
    ]
  },
  {
    q: "이번 달 카드값 보고 드는 생각은?",
    opts: [
      { text: "어디서 이렇게 썼지?", scores: { unplanned: 3 } },
      { text: "배달을 좀 줄여야 하는데...", scores: { delivery: 2, impulse: 1 } },
      { text: "구독 서비스가 너무 많긴 해", scores: { subscription: 3 } },
      { text: "생각보다 괜찮은데?", scores: { saver: 3 } },
    ]
  }
];

const TYPE_DATA = {
  latte:        { emoji: "☕", name: "라떼형 저축러", headline: "매일 커피 한 잔이\n미래를 마시고 있어요", desc: "카페는 나의 힐링 공간. 근데 그 힐링이 한 달에 꽤 쌓여요.", monthly: 55000, label: "카페 지출", saveRatio: 0.5, source: "오픈서베이 카페 트렌드 리포트 2024", tip: "카페 지출을 절반으로 줄이면 목표를 크게 앞당길 수 있어요.", color: "#7C5C3E", bg: "#FFF8F3", accent: "#C28B5A" },
  delivery:     { emoji: "🛵", name: "배달형 저축러", headline: "오늘도 앱을 켜는\n그 손가락이 문제예요", desc: "편리함의 대가는 배달비 포함 한 끼 1.5배. 모이면 꽤 커요.", monthly: 98000, label: "배달 지출", saveRatio: 0.55, source: "와이즈앱·리테일 배달앱 동향 리포트 2025.3", tip: "주 4회 → 2회로만 줄여도 절감액이 확 달라져요.", color: "#6B4D8A", bg: "#F9F5FF", accent: "#9B7EC8" },
  impulse:      { emoji: "📦", name: "박스형 저축러", headline: "오늘도 택배가\n먼저 알고 있어요", desc: "구경만 하려다 결제까지. 그 클릭들이 통장을 비우고 있어요.", monthly: 80000, label: "온라인 쇼핑", saveRatio: 0.4, source: "통계청 가계동향조사 2024 (1인 가구 기준)", tip: "구매 전 24시간 대기 규칙 하나로 충동 지출을 크게 줄여요.", color: "#2D6A8A", bg: "#F3F9FF", accent: "#4A9EC2" },
  subscription: { emoji: "📱", name: "구독형 저축러", headline: "쓰지도 않는 구독이\n매달 빠져나가고 있어요", desc: "하나하나는 소액이지만, 합치면 월 4만원은 훌쩍 넘어요.", monthly: 42000, label: "구독 지출", saveRatio: 0.5, source: "컨슈머인사이트 OTT 구독 조사 2025 상반기", tip: "안 쓰는 구독 2개만 끊어도 절감 효과가 바로 나타나요.", color: "#1A7A5E", bg: "#F2FBF7", accent: "#3AAB80" },
  saver:        { emoji: "🎯", name: "균형형 저축러", headline: "이미 잘 하고 있어요,\n조금만 더 다듬으면 돼요", desc: "또래 평균보다 저축률이 높아요. 이제 수익률을 높일 차례예요.", monthly: 30000, label: "불필요 지출", saveRatio: 0.3, source: "통계청 가계동향조사 2024", tip: "적금 일부를 ETF로 전환하면 복리 효과로 목표를 앞당겨요.", color: "#1A5CA8", bg: "#F3F7FF", accent: "#3A7EDC" },
  unplanned:    { emoji: "😶", name: "무계획형 저축러", headline: "어디서 썼는지 모르는 게\n가장 큰 구멍이에요", desc: "소비 파악이 안 되면 줄일 수도 없어요. 먼저 기록부터 시작해요.", monthly: 70000, label: "파악 안 된 지출", saveRatio: 0.3, source: "통계청 가계동향조사 2024 (기타 소비 항목 기준)", tip: "한 달만 지출 기록해보면 불필요 지출이 바로 보여요.", color: "#7A5C1A", bg: "#FFFBF0", accent: "#C4973A" },
};

function fmt(n) {
  const wan = Math.round(n / 10000);
  if (wan >= 10000) return (wan / 10000).toFixed(1) + "억";
  if (wan >= 1000) return (wan / 1000).toFixed(1) + "천만";
  if (wan > 0) return wan + "만원";
  return Math.round(n / 1000) + "천원";
}

let income = 350;
let qIndex = 0;
let selected = null;
let answers = [];
let resultType = null;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

function calcType(ans) {
  const scores = { latte: 0, delivery: 0, impulse: 0, subscription: 0, saver: 0, unplanned: 0 };
  ans.forEach((ai, qi) => {
    Object.entries(QUESTIONS[qi].opts[ai].scores).forEach(([k, v]) => scores[k] += v);
  });
  return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
}

function calcStats(type) {
  const { monthly, saveRatio } = TYPE_DATA[type];
  const yearly = monthly * 12;
  const savable = Math.round(yearly * saveRatio);
  const ms = Math.round(savable / 12);
  const future10y = Math.round(ms * ((Math.pow(1 + 0.04/12, 120) - 1) / (0.04/12)));
  return { monthly, yearly, future10y };
}

// 소득 선택
document.querySelectorAll("#income-options .opt-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    income = Number(btn.dataset.income);
    // 첫 질문(소득)에 답한 순간 = 퀴즈 시작
    if (window.tm) window.tm.track("quiz_start");
    qIndex = 0;
    answers = [];
    selected = null;
    renderQuestion();
    showScreen("s-quiz");
  });
});

function renderQuestion() {
  const q = QUESTIONS[qIndex];
  const step = qIndex + 2;
  const pct = Math.round(((step - 1) / 5) * 100);
  document.getElementById("q-counter").textContent = `Q${step} / 5`;
  document.getElementById("q-pct").textContent = `${pct}%`;
  document.getElementById("q-fill").style.width = `${pct}%`;
  document.getElementById("q-text").textContent = q.q;

  const container = document.getElementById("q-options");
  container.innerHTML = "";
  selected = null;
  document.getElementById("nextBtn").classList.remove("enabled");
  document.getElementById("nextBtn").textContent = qIndex < QUESTIONS.length - 1 ? "다음 →" : "결과 보기 →";

  q.opts.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt.text;
    btn.addEventListener("click", () => {
      selected = idx;
      container.querySelectorAll(".opt-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      document.getElementById("nextBtn").classList.add("enabled");
    });
    container.appendChild(btn);
  });
}

document.getElementById("nextBtn").addEventListener("click", () => {
  if (selected === null) return;
  answers.push(selected);
  if (qIndex < QUESTIONS.length - 1) {
    qIndex++;
    renderQuestion();
  } else {
    resultType = calcType(answers);
    if (window.tm) window.tm.setQuizType(resultType);
    renderResult();
    showScreen("s-result");
    if (window.tm) window.tm.track("quiz_complete", { quiz_type: resultType });
  }
});

function renderResult() {
  const t = TYPE_DATA[resultType];
  const stats = calcStats(resultType);

  document.getElementById("result-badge").style.cssText = `background:${t.bg};color:${t.color};border:1px solid ${t.accent}40`;
  document.getElementById("result-badge").textContent = `${t.emoji} ${t.name}`;
  document.getElementById("result-headline").textContent = t.headline;
  document.getElementById("result-desc").textContent = t.desc;

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-box" style="background:${t.bg}">
      <div class="stat-box-label" style="color:${t.color}">연간 ${t.label}</div>
      <div class="stat-box-value" style="color:${t.color}">${fmt(stats.yearly)}</div>
      <div class="stat-box-sub" style="color:${t.color}">월 ${fmt(stats.monthly)} 기준</div>
    </div>
    <div class="stat-box" style="background:${t.bg}">
      <div class="stat-box-label" style="color:${t.color}">10년 후 기회비용</div>
      <div class="stat-box-value" style="color:${t.color}">${fmt(stats.future10y)}</div>
      <div class="stat-box-sub" style="color:${t.color}">절감분 연 4% 투자 시</div>
    </div>
  `;

  document.getElementById("source-row").textContent = `📎 수치 출처: ${t.source}`;
  document.getElementById("tip-box").style.borderLeftColor = t.accent;
  document.getElementById("tip-text").textContent = t.tip;

  // 시뮬레이터 연결 버튼: 월 적립액 기본값 = 소득 × 20% (만 원)
  const monthlySave = Math.round(income * 0.2);
  document.getElementById("simBtn").onclick = () => {
    window.location.href = `sim.html?from=quiz&type=${resultType}&save=${monthlySave}`;
  };
}

document.getElementById("startBtn").addEventListener("click", () => showScreen("s-income"));

document.getElementById("shareBtn").addEventListener("click", () => {
  if (!resultType) return;
  const t = TYPE_DATA[resultType];
  const stats = calcStats(resultType);
  const text = `나의 소비 유형은 ${t.emoji} ${t.name}!\n연간 ${t.label} ${fmt(stats.yearly)} → 아끼면 10년 후 ${fmt(stats.future10y)} 차이!\n\n티끌모아에서 나도 진단해보기 → https://tikklemoa.vercel.app/quiz.html`;
  if (navigator.share) {
    navigator.share({ title: "티끌모아 소비 유형 진단", text }).catch(() => {});
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById("toast");
    toast.textContent = "✓ 클립보드에 복사됐어요!";
    setTimeout(() => toast.textContent = "", 2000);
  });
});

document.getElementById("retryBtn").addEventListener("click", () => {
  qIndex = 0; answers = []; selected = null; resultType = null;
  showScreen("s-landing");
});
</script>
<script type="module">
  import { track, setQuizType } from "./js/track.js";
  window.tm = { track, setQuizType };
  // 퀴즈 랜딩 화면 노출
  if (document.getElementById("s-landing").classList.contains("active")) track("quiz_landing_view");
</script>
</body>
</html>
