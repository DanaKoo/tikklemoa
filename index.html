<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>티끌모아 v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#f4f1ea; --surface:#ffffff; --surface-2:#faf8f3; --line:#e7e2d6; --line-2:#d9d2c1;
  --ink:#1d1b16; --ink-2:#5b574c; --ink-3:#8f897a;
  --brand:#e8792b; --brand-ink:#ffffff; --brand-soft:#fdeedf; --brand-deep:#b9541a;
  --fill:#f2a65a; --fill-2:#f8d3a6; --ghost:#f6c99633;
  --good:#2f8f5b; --bad:#d2453b; --bad-soft:#fdeceb;
  --chart-line:#e8792b; --chart-area:#e8792b22; --target:#3a6fd8;
  --kakao:#fee500; --kakao-ink:#191600;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151410; --surface:#1f1d18; --surface-2:#26241e; --line:#34312a; --line-2:#433f36;
    --ink:#f3efe6; --ink-2:#c3bdaf; --ink-3:#8c8678;
    --brand:#f08a3e; --brand-soft:#3a2617; --brand-deep:#f5a66a;
    --fill:#e98f43; --fill-2:#6b4426; --ghost:#f08a3e30;
    --bad-soft:#3a1d1a; --chart-area:#f08a3e26; --target:#6f9cff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#151410; --surface:#1f1d18; --surface-2:#26241e; --line:#34312a; --line-2:#433f36;
  --ink:#f3efe6; --ink-2:#c3bdaf; --ink-3:#8c8678;
  --brand:#f08a3e; --brand-soft:#3a2617; --brand-deep:#f5a66a;
  --fill:#e98f43; --fill-2:#6b4426; --ghost:#f08a3e30;
  --bad-soft:#3a1d1a; --chart-area:#f08a3e26; --target:#6f9cff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- preview shell ---------- */
.shell{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 16px 32px}
.devbar[hidden],.log[hidden]{display:none}
.devbar{width:100%;max-width:420px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.devbar .tag{font-weight:700;color:var(--ink-2);margin-right:2px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.phone{width:100%;max-width:420px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;min-height:760px;display:flex;flex-direction:column}
@media (min-width:600px){.phone{border:1px solid var(--line-2);box-shadow:var(--shadow);background:var(--surface-2)}}

/* ---------- app chrome ---------- */
.top{display:flex;align-items:center;gap:8px;padding:16px 20px 8px;min-height:56px}
.top .back{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-left:-8px}
.top .back:hover{background:var(--line)}
.logo{font-weight:800;font-size:17px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.logo i{width:20px;height:20px;border-radius:6px;background:var(--brand);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.top .sp{flex:1}
.top .link{font-size:13px;color:var(--ink-2);padding:6px 8px;border-radius:10px}
.top .link:hover{background:var(--line)}
.screen{flex:1;padding:4px 20px 28px;display:flex;flex-direction:column}
.screen.enter{animation:in .22s ease}
@keyframes in{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}
.qbody.enter{animation:qin .22s ease}
@keyframes qin{from{opacity:.3;transform:translateX(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.3;font-weight:800;letter-spacing:-.035em}
h2{font-size:20px;line-height:1.35;font-weight:750;letter-spacing:-.03em}
h3{font-size:15px;font-weight:700}
.sub{color:var(--ink-2);font-size:15px}
.muted{color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px}
.grow{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font-weight:700;font-size:16px;width:100%;transition:transform .08s, filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary:disabled{background:var(--line-2);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2)}
.btn.kakao{background:var(--kakao);color:var(--kakao-ink)}
.btn.sm{height:42px;font-size:14px;border-radius:12px}
.cta{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep)}

/* ---------- landing ---------- */
.hero{padding:18px 0 8px}
.hero h1 em{font-style:normal;color:var(--brand)}
.coins{display:flex;align-items:flex-end;gap:6px;height:120px;margin:22px 0 18px}
.coins span{flex:1;border-radius:10px 10px 4px 4px;background:var(--fill-2);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.coins span:last-child{background:var(--brand)}
@keyframes grow{from{transform:scaleY(.1);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.resume{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.resume .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:20px;flex:none}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;background:var(--brand-soft);color:var(--brand-deep);margin-bottom:12px}

/* ---------- quiz ---------- */
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 22px}
.progress b{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.qnum{font-size:13px;font-weight:700;color:var(--brand)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{text-align:left;padding:16px 18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-size:15px;font-weight:550;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--line-2)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}

/* ---------- type result ---------- */
.typecard{text-align:center;padding:28px 20px}
.typecard .emo{font-size:64px;line-height:1;margin-bottom:12px}
.traits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.traits span{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:650;color:var(--ink-2);display:flex;justify-content:space-between}
.field label small{font-weight:500;color:var(--ink-3)}
.inp{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;height:54px;transition:border-color .15s}
.inp:focus-within{border-color:var(--brand)}
.inp.err{border-color:var(--bad);background:var(--bad-soft)}
.inp input{flex:1;border:0;background:transparent;outline:none;font-size:18px;font-weight:650;min-width:0;text-align:right}
.inp input::placeholder{color:var(--ink-3);font-weight:500}
.inp .unit{margin-left:6px;color:var(--ink-2);font-weight:600}
.inp select{flex:1;border:0;background:transparent;outline:none;font-size:17px;font-weight:650;appearance:none;-webkit-appearance:none;cursor:pointer}
.hint{font-size:12.5px;color:var(--ink-3);min-height:18px;text-align:right}
.hint.e{color:var(--bad);text-align:left}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.errbox{border-radius:14px;padding:12px 14px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
details.adv summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary .car{transform:rotate(90deg)}
.car{display:inline-block;transition:transform .2s}

/* ---------- result ---------- */
.headline{padding:6px 0 18px}
.headline .big{font-size:32px;font-weight:850;letter-spacing:-.04em;line-height:1.2;color:var(--brand)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kpi .d{font-size:12px;color:var(--good);font-weight:600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{font-size:10px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;font-size:12.5px;font-weight:650;padding:6px 8px;border-radius:9px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.plan svg{width:100%;height:auto;display:block}
.plan .room-l{font-size:11px;font-weight:650;fill:var(--ink-2)}
.plan .room-a{font-size:9px;fill:var(--ink-3)}
.pct{display:flex;align-items:center;gap:12px;margin-top:12px}
.pct .bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.pct .bar b{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pct strong{font-size:20px;font-weight:850;min-width:64px;text-align:right}
.note{font-size:12px;color:var(--ink-3);margin-top:10px}

/* ---------- report ---------- */
.report{background:linear-gradient(160deg,var(--brand) 0%,#f4a259 100%);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden}
.report .m{font-size:13px;opacity:.9;font-weight:600}
.report .one{font-size:21px;font-weight:800;line-height:1.38;letter-spacing:-.03em;margin:10px 0 16px}
.report .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:rgba(255,255,255,.16);border-radius:14px;padding:12px}
.report .stats div{font-size:11px;opacity:.95}
.report .stats b{display:block;font-size:14px;margin-top:2px}
.report .mini{position:absolute;right:-6px;top:-4px;width:120px;opacity:.28}
.list .item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list .item:last-child{border-bottom:0}
.list .badge{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.empty{text-align:center;padding:40px 0;color:var(--ink-3)}

/* ---------- sheet / toast ---------- */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:22px 20px 24px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.kcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0}
.kcard .img{height:110px;background:linear-gradient(160deg,var(--brand),#f4a259);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;text-align:center;padding:10px}
.kcard .tx{padding:12px 14px;font-size:13px}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;z-index:30;white-space:nowrap;animation:fade .2s}
.fail{text-align:center;padding:10px 0 4px}
.fail .ic{width:56px;height:56px;border-radius:18px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-size:26px;margin:0 auto 12px;font-weight:800}

/* ---------- event log ---------- */
.log{width:100%;max-width:420px;font-size:12px;color:var(--ink-2)}
.log summary{cursor:pointer;font-weight:700;color:var(--ink-3)}
.log ol{list-style:none;margin-top:8px;max-height:200px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.log li{padding:2px 0;border-bottom:1px dashed var(--line)}
.log li:last-child{border:0}
</style>
</head>
<body>
<div class="shell">
  <div class="devbar" aria-label="프리뷰 도구">
    <span class="tag">프리뷰</span>
    <button class="chip" id="failT" aria-pressed="false">실패 시뮬레이션</button>
    <button class="chip" id="shareView">공유링크 유입</button>
    <button class="chip" id="reset">초기화</button>
  </div>
  <div class="phone" id="phone">
    <div class="top" id="top"></div>
    <main class="screen" id="app"></main>
  </div>
  <details class="log">
    <summary>퍼널 이벤트 로그 (기획자용)</summary>
    <ol id="log"></ol>
  </details>
</div>

<script>
/* ================= storage (safe) ================= */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }, // throws on failure on purpose
  trySet(k, v){ try{ LS.set(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k);}catch(e){} }
};
const K = { input:'tk2.input', reports:'tk2.reports', events:'tk2.events', entry:'tk2.entry' };
const DAY = 864e5;

/* ================= state ================= */
const S = {
  screen:'landing', ref: new URLSearchParams(location.search).get('ref') || null,
  qi:0, answers:[], type:null,
  draft:null, errors:{}, formError:false,
  planView:'now', failMode:false, toast:null, sheet:null, viewReport:null, history:[]
};

/* ================= analytics ================= */
function track(name, props={}){
  const ev = { t:new Date().toISOString(), name, entry:LS.get(K.entry,'direct'), ...props };
  const all = LS.get(K.events, []); all.push(ev); LS.trySet(K.events, all.slice(-200));
  renderLog();
}
function renderLog(){
  const all = LS.get(K.events, []);
  document.getElementById('log').innerHTML = all.slice().reverse().map(e =>
    `<li>${e.t.slice(11,19)} · <b>${e.name}</b>${e.entry!=='direct'?' · '+e.entry:''}${e.extra?' · '+e.extra:''}</li>`).join('') || '<li>아직 이벤트가 없어요</li>';
}

/* ================= content ================= */
// 기존 배포 퀴즈(quiz.html)의 문항·점수·유형 데이터를 그대로 사용
const TYPES = {
  latte:        { emo:'☕', name:'라떼형 저축러', headline:'매일 커피 한 잔이<br>미래를 마시고 있어요', desc:'카페는 나의 힐링 공간. 근데 그 힐링이 한 달에 꽤 쌓여요.', monthly:55000, label:'카페 지출', saveRatio:.5, source:'오픈서베이 카페 트렌드 리포트 2024', tip:'카페 지출을 절반으로 줄이면 목표를 크게 앞당길 수 있어요.' },
  delivery:     { emo:'🛵', name:'배달형 저축러', headline:'오늘도 앱을 켜는<br>그 손가락이 문제예요', desc:'편리함의 대가는 배달비 포함 한 끼 1.5배. 모이면 꽤 커요.', monthly:98000, label:'배달 지출', saveRatio:.55, source:'와이즈앱·리테일 배달앱 동향 리포트 2025.3', tip:'주 4회 → 2회로만 줄여도 절감액이 확 달라져요.' },
  impulse:      { emo:'📦', name:'박스형 저축러', headline:'오늘도 택배가<br>먼저 알고 있어요', desc:'구경만 하려다 결제까지. 그 클릭들이 통장을 비우고 있어요.', monthly:80000, label:'온라인 쇼핑', saveRatio:.4, source:'통계청 가계동향조사 2024 (1인 가구 기준)', tip:'구매 전 24시간 대기 규칙 하나로 충동 지출을 크게 줄여요.' },
  subscription: { emo:'📱', name:'구독형 저축러', headline:'쓰지도 않는 구독이<br>매달 빠져나가고 있어요', desc:'하나하나는 소액이지만, 합치면 월 4만원은 훌쩍 넘어요.', monthly:42000, label:'구독 지출', saveRatio:.5, source:'컨슈머인사이트 OTT 구독 조사 2025 상반기', tip:'안 쓰는 구독 2개만 끊어도 절감 효과가 바로 나타나요.' },
  saver:        { emo:'🎯', name:'균형형 저축러', headline:'이미 잘 하고 있어요,<br>조금만 더 다듬으면 돼요', desc:'또래 평균보다 저축률이 높아요. 이제 수익률을 높일 차례예요.', monthly:30000, label:'불필요 지출', saveRatio:.3, source:'통계청 가계동향조사 2024', tip:'적금 일부를 ETF로 전환하면 복리 효과로 목표를 앞당겨요.' },
  unplanned:    { emo:'😶', name:'무계획형 저축러', headline:'어디서 썼는지 모르는 게<br>가장 큰 구멍이에요', desc:'소비 파악이 안 되면 줄일 수도 없어요. 먼저 기록부터 시작해요.', monthly:70000, label:'파악 안 된 지출', saveRatio:.3, source:'통계청 가계동향조사 2024 (기타 소비 항목 기준)', tip:'한 달만 지출 기록해보면 불필요 지출이 바로 보여요.' }
};
const QUIZ = [
  { q:'월급날 제일 먼저 하는 건?', o:[['쓰고 싶은 거 먼저 삼',{impulse:2,delivery:1}],['적금 먼저 넣고 나머지로 생활',{saver:3}],['딱히 계획 없이 그냥 씀',{unplanned:3}],['고정비·구독 정산부터',{subscription:2,latte:1}]] },

function typeStats(t){
  const yearly = t.monthly*12, ms = Math.round(yearly*t.saveRatio/12);
  const future10y = Math.round(ms*((Math.pow(1+0.04/12,120)-1)/(0.04/12)));
  return { yearly, future10y };
}

/* ================= finance ================= */
function project(cash, monthly, annualPct, months){
  const r = (annualPct||0)/100/12; const pts=[cash]; let b=cash;
  for(let i=1;i<=months;i++){ b = b*(1+r) + monthly; pts.push(b); }
  return pts;
}
function monthsUntil(y,m){ const n=new Date(); return (y - n.getFullYear())*12 + (m - (n.getMonth()+1)); }
function monthsToReach(cash, monthly, pct, target){
  if(cash >= target) return 0;
  if(monthly<=0 && !(pct>0 && cash>0)) return Infinity;
  const r=(pct||0)/100/12; let b=cash;
  for(let i=1;i<=600;i++){ b=b*(1+r)+monthly; if(b>=target) return i; }
  return Infinity;
}
function addMonths(n){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+n); return d; }

/* ================= format ================= */
const comma = n => Math.round(n).toLocaleString('ko-KR');
function won(n, short){
  n = Math.round(n);
  if(n < 10000) return comma(n)+'원';
  const eok = Math.floor(n/1e8), man = Math.floor((n%1e8)/1e4);
  if(eok>0) return eok+'억' + (man? ' '+comma(man)+'만':'') + (short?'':' 원');
  return comma(man)+'만' + (short?'':' 원');
}
function axisWon(n){ if(n>=1e8) return (n/1e8).toFixed(n%1e8?1:0)+'억'; if(n>=1e4) return comma(n/1e4)+'만'; return comma(n); }
const ym = d => `${d.getFullYear()}년 ${d.getMonth()+1}월`;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= navigation ================= */
function go(screen, opts={}){
  if(!opts.replace && S.screen!==screen) S.history.push(S.screen);
  S.screen = screen; S.sheet=null; render(); window.scrollTo({top:0});
}
function back(){ S.screen = S.history.pop() || 'landing'; S.sheet=null; render(); }
function toast(msg){ S.toast=msg; renderOverlay(); clearTimeout(toast._t); toast._t=setTimeout(()=>{S.toast=null; renderOverlay();},2200); }

V.shareFail = () => failView('카카오톡 공유에 실패했어요','네트워크 상태를 확인하고 다시 시도해 주세요.','retryShare');
function failView(t, s, act){
  return `<div class="fail" style="margin-top:60px"><div class="ic">!</div><h2>${t}</h2><p class="sub" style="margin-top:8px;font-size:14px">${s}</p></div>
  <div class="cta"><button class="btn primary" data-act="${act}">다시 시도하기</button><button class="btn ghost sm" data-act="back">리포트로 돌아가기</button></div>`;
}

/* ================= charts ================= */
function chartSVG(pts, target, mt, horizon){
  const W=320,H=190,pl=40,pr=12,pt=14,pb=26;
  const max = Math.max(target, pts[pts.length-1]) * 1.08 || 1;
  const x = i => pl + (W-pl-pr)*i/horizon;
  const y = v => pt + (H-pt-pb)*(1 - v/max);
  const line = pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = line + `L${x(horizon)},${y(0)}L${x(0)},${y(0)}Z`;
  const years = horizon/12; const step = years<=5?1: years<=10?2: 5;
  let xt=''; for(let yy=0; yy<=years; yy+=step){ xt+=`<text class="axis" x="${x(yy*12)}" y="${H-8}" text-anchor="middle">${yy?yy+'년':'지금'}</text>`; }
  let yt=''; for(let k=0;k<=3;k++){ const v=max*k/3; yt+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${pl-6}" y="${y(v)+3}" text-anchor="end">${axisWon(v)}</text>`; }
  const dot = (i,l) => `<circle cx="${x(i)}" cy="${y(pts[i])}" r="4.5" fill="var(--surface)" stroke="var(--chart-line)" stroke-width="2.5"/><text x="${x(i)}" y="${y(pts[i])-10}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--ink)">${l}</text>`;
  const tx = x(Math.min(mt,horizon));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="연도별 예상 자산 그래프">
    ${yt}
    <line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--target)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="${tx}" x2="${tx}" y1="${pt}" y2="${y(0)}" stroke="var(--target)" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>
    <text x="${tx}" y="${pt-3}" text-anchor="${tx>W-60?'end':'middle'}" style="font-size:9.5px;fill:var(--target);font-weight:700">목표 시점</text>
    <path d="${area}" fill="var(--chart-area)"/>
    <path d="${line}" fill="none" stroke="var(--chart-line)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dot(12,'1년')}${dot(36,'3년')}
    ${xt}
  </svg>`;
}

// 59㎡ 3베이 판상형 템플릿 (단위: 0.1m 근사)
const ROOMS = [
  {k:'현관',   x:230,y:236,w:60, h:64, a:2.4},
  {k:'주방·식당',x:110,y:170,w:120,h:130,a:9.8},
  {k:'거실',   x:110,y:40, w:160,h:130,a:13.6},
  {k:'욕실',   x:230,y:170,w:60, h:66, a:3.2},
  {k:'침실3',  x:0,  y:170,w:110,h:130,a:7.4},
  {k:'침실2',  x:0,  y:40, w:110,h:130,a:7.6},
  {k:'안방욕실',x:290,y:170,w:110,h:56, a:3.0},
  {k:'드레스룸',x:290,y:226,w:110,h:74, a:3.6},
  {k:'안방',   x:270,y:40, w:130,h:130,a:10.4},
];
const BALC = {x:0,y:0,w:400,h:40};
function planSVG(pct, basePct, mini){
  const total = ROOMS.reduce((s,r)=>s+r.a,0);
  let acc=0; const target = pct/100*total, base = basePct/100*total;
  const uid = Math.random().toString(36).slice(2,7);
  let fills='', ghosts='', walls='', labels='';
  ROOMS.forEach(r=>{
    const f = Math.max(0, Math.min(1, (target-acc)/r.a));
    const g = Math.max(0, Math.min(1, (base-acc)/r.a));
    acc += r.a;
    const fh = r.h*f;
    fills += `<rect x="${r.x}" y="${r.y + r.h - fh}" width="${r.w}" height="${fh}" fill="${f>=1?'var(--fill)':'var(--fill-2)'}" style="transition:all .6s"/>`;
    if(g>0 && g<1) ghosts += `<line x1="${r.x+4}" x2="${r.x+r.w-4}" y1="${r.y+r.h-r.h*g}" y2="${r.y+r.h-r.h*g}" stroke="var(--brand-deep)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    walls += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="none" stroke="var(--ink)" stroke-width="${mini?6:3}"/>`;
    if(!mini){
      const small = r.w<70;
      labels += `<text class="room-l" x="${r.x+r.w/2}" y="${r.y+r.h/2 - (small?0:2)}" text-anchor="middle" style="${small?'font-size:9.5px':''}">${r.k}</text>`;
      if(!small) labels += `<text class="room-a" x="${r.x+r.w/2}" y="${r.y+r.h/2+12}" text-anchor="middle">${r.a}㎡</text>`;
    }
  });
  const door = mini?'':`<path d="M290 300 A 34 34 0 0 0 256 266" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/>
    <line x1="256" y1="300" x2="290" y2="300" stroke="var(--surface)" stroke-width="5"/>`;
  return `<svg viewBox="-6 -6 412 312" role="img" aria-label="59제곱미터 도면, ${pct.toFixed(0)}% 채워짐">
    <defs><pattern id="hb${uid}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--line-2)" stroke-width="2"/></pattern></defs>
    <rect x="${BALC.x}" y="${BALC.y}" width="${BALC.w}" height="${BALC.h}" fill="url(#hb${uid})" stroke="var(--ink)" stroke-width="${mini?4:1.5}"/>
    ${mini?'':`<text class="room-a" x="200" y="24" text-anchor="middle">발코니 (서비스 면적)</text>`}
    <rect x="0" y="40" width="400" height="260" fill="var(--surface-2)"/>
    ${fills}${ghosts}${walls}${labels}${door}
  </svg>`;
}

/* ================= report logic ================= */
function buildReport(d){
  const pts = project(d.cash, d.monthly, d.rate, 36);
  const now = new Date();
  return { id: Date.now().toString(36), month: ym(now), createdLabel: `${now.getMonth()+1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
    cash:d.cash, monthly:d.monthly, target:d.target, y3:pts[36], pct: Math.min(100, d.cash/d.target*100) };
}
function doSave(){
  const d = savedInput() || S.draft; const r = buildReport(d);
  try{
    if(S.failMode) throw new Error('sim');
    const list = LS.get(K.reports,[]); list.push(r); LS.set(K.reports, list);
    track('report_save');
    S.viewReport = r; go('reportView', {replace:true}); toast('리포트를 저장했어요');
  }catch(e){ track('report_save_fail'); go('saveFail'); }
}
function openShareSheet(){ S.sheet='share'; renderOverlay(); }
function doShare(){
  S.sheet=null;
  if(S.failMode){ track('kakao_share_fail'); go('shareFail'); return; }
  track('kakao_share');
  const url = location.origin + location.pathname + '?ref=share';
  try{ navigator.clipboard?.writeText(url).catch(()=>{}); }catch(e){}
  renderOverlay(); toast('카카오톡으로 보냈어요 (프리뷰: 링크 복사됨)');
}

/* ================= quiz logic ================= */
function answer(i){
  if(S.qi===0 && S.answers.length===0) track('quiz_start');
  if(answer.busy) return; answer.busy=true;
  S.answers[S.qi]=i;
  document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',k===i));
  setTimeout(()=>{ answer.busy=false;
    if(S.qi < QUIZ.length-1){ S.qi++; render(); }
    else{
      const score={latte:0,delivery:0,impulse:0,subscription:0,saver:0,unplanned:0};
      S.answers.forEach((a,qi)=>Object.entries(QUIZ[qi].o[a][1]).forEach(([k,v])=>score[k]+=v));
      const best = Object.entries(score).sort((x,y)=>y[1]-x[1])[0][0];
      S.type=best; track('quiz_complete'); track('type_result_view'); go('type',{replace:true});
    }
  }, 220);
}

/* ================= form logic ================= */
function readForm(){
  const n = id => { const el=document.getElementById(id); if(!el) return ''; const v=el.value.replace(/[^\d-]/g,''); return v===''?'':Number(v); };
  const rateEl = document.getElementById('rate');
  S.draft = { ...S.draft, cash:n('cash'), monthly:n('monthly'), target:n('target'),
    ty: document.getElementById('ty').value, tm: document.getElementById('tm').value,
    rate: rateEl && rateEl.value!=='' ? Number(rateEl.value) : '' };
}
function validate(d){
  const e={};
  ['cash','monthly','target'].forEach(k=>{ if(d[k]==='' || isNaN(d[k])) e[k]='금액을 입력해 주세요'; else if(d[k]<0) e[k]='0원 이상으로 입력해 주세요'; });
  if(!e.target && d.target===0) e.target='목표 금액은 0원보다 커야 해요';
  if(!d.ty || !d.tm) e.when='목표 연도와 월을 선택해 주세요';
  else if(monthsUntil(+d.ty,+d.tm) < 1) e.when='다음 달 이후 시점을 선택해 주세요';
  if(d.rate!=='' && (isNaN(d.rate) || d.rate<0 || d.rate>30)) e.rate='0~30% 사이로 입력해 주세요';
  return e;
}
function submit(){
  readForm(); const e = validate(S.draft); S.errors=e;
  if(Object.keys(e).length){ S.formError=true; track('input_error',{extra:Object.keys(e).join(',')}); render(); return; }
  S.formError=false;
  const d = { ...S.draft, cash:+S.draft.cash, monthly:+S.draft.monthly, target:+S.draft.target, ty:+S.draft.ty, tm:+S.draft.tm, rate:S.draft.rate===''?0:+S.draft.rate };
  const prev = LS.get(K.input,null);
  const ok = !S.failMode && LS.trySet(K.input, { ...d, savedAt:Date.now(), firstAt: prev?.firstAt || Date.now() });
  if(!ok){ S.draft=d; S.formError=false; render(); toast('저장에 실패했어요. 입력값은 그대로예요 — 다시 시도해 주세요'); track('input_save_fail'); return; }
  if(prev && Date.now()-prev.firstAt <= 30*DAY) track('input_edit_within_30d'); else track('input_complete');
  S.draft = d; S.planView='now'; go('result');
}

/* ================= render ================= */
const TITLES = { quiz:'', type:'', input:'자산 입력', result:'내 자산 성장', report:'리포트', reportView:'리포트', saved:'보관함', saveFail:'', shareFail:'' };
function renderTop(){
  const t = document.getElementById('top');
  if(S.screen==='landing'){
    t.innerHTML = `<span class="logo"><i>티</i>티끌모아</span><span class="sp"></span>${LS.get(K.reports,[]).length?`<button class="link" data-go="saved">보관함</button>`:''}`;
  }else{
    t.innerHTML = `<button class="back" data-act="back" aria-label="뒤로"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <b style="font-size:16px">${TITLES[S.screen]||''}</b><span class="sp"></span>
    ${['result','report'].includes(S.screen)?`<button class="link" data-go="saved">보관함</button>`:''}`;
  }
}
function render(){
  renderTop();
  const app = document.getElementById('app');
  app.innerHTML = V[S.screen]();
  if(S.screen !== render.last){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); }
  if(S.screen==='quiz'){
    const qb = app.querySelector('.qbody'), bar = document.getElementById('qbar');
    if(render.lastQi !== S.qi && render.last==='quiz') qb.classList.add('enter');
    requestAnimationFrame(()=>{ bar.style.width = (S.qi/QUIZ.length*100)+'%'; });
    render.lastQi = S.qi;
  } else render.lastQi = null;
  render.last = S.screen;
  renderOverlay(); syncDev();
}
function renderOverlay(){
  const phone = document.getElementById('phone');
  phone.querySelectorAll('.dim,.toast').forEach(n=>n.remove());
  if(S.sheet==='share'){
    const d = savedInput() || S.draft; const r = buildReport(d);
    phone.insertAdjacentHTML('beforeend', `<div class="dim" data-act="dimClose"><div class="sheet">
      <h3 style="font-size:17px">카카오톡으로 공유</h3>
      <p class="muted">친구에게 이렇게 보여요 · 자산 금액은 포함되지 않아요</p>
      <div class="kcard"><div class="img">📐 내 집 도면 채우는 중!</div>
        <div class="tx"><b>나는 어떤 소비 유형일까?</b><br><span class="muted">티끌모아 · 1분 소비 유형 테스트 하러 가기</span></div></div>
      <div class="row"><button class="btn ghost sm grow" data-act="closeSheet">취소</button><button class="btn kakao sm grow" data-act="doShare">보내기</button></div>
    </div></div>`);
  }
  if(S.toast) phone.insertAdjacentHTML('beforeend', `<div class="toast" role="status">${esc(S.toast)}</div>`);
}
function syncDev(){
  document.getElementById('failT').setAttribute('aria-pressed', S.failMode);
  document.getElementById('shareView').setAttribute('aria-pressed', S.ref==='share');
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-go],[data-ans],[data-plan],[data-add],[data-rid]'); if(!el) return;
  if(el.dataset.go){ go(el.dataset.go); return; }
  if(el.dataset.ans!=null){ answer(+el.dataset.ans); return; }
  if(el.dataset.plan){ S.planView=el.dataset.plan; render(); return; }
  if(el.dataset.rid){ S.viewReport = LS.get(K.reports,[]).find(r=>r.id===el.dataset.rid); go('reportView'); return; }
  if(el.dataset.add){ readForm(); const k=el.dataset.add; S.draft[k]=(+S.draft[k]||0)+(+el.dataset.v); delete S.errors[k]; render(); return; }
  const a = el.dataset.act;
  if(a==='dimClose'){ if(e.target===el){ S.sheet=null; renderOverlay(); } return; }
  ({
    back, startQuiz(){ S.qi=0; S.answers=[]; go('quiz'); },
    restartQuiz(){ S.qi=0; S.answers=[]; S.history=['landing']; S.screen='quiz'; render(); },
    enterSim(){ track('sim_enter'); const s=savedInput(); S.draft = s?{...s}:{cash:'',monthly:'',target:'',ty:'',tm:'',rate:''}; S.errors={}; S.formError=false; go('input'); },
    resume(){ track('revisit_resume'); S.draft={...savedInput()}; go('result'); },
    submit, edit(){ track('input_edit_open'); S.draft={...(savedInput()||S.draft)}; S.errors={}; S.formError=false; go('input'); },
    toResult(){ S.draft={...savedInput()}; S.history=['landing']; S.screen='result'; render(); },
    save: doSave, retrySave(){ S.screen='report'; doSave(); },
    share: openShareSheet, retryShare(){ S.screen='report'; S.history.pop(); render(); openShareSheet(); },
    doShare, closeSheet(){ S.sheet=null; renderOverlay(); }
  })[a]?.();
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.matches('[data-money]')){
    const raw = el.value.replace(/[^\d]/g,'');
    el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
    const h = document.getElementById(el.id+'-h'); if(h){ h.className='hint'; h.textContent = raw? won(+raw):''; }
    el.closest('.inp').classList.remove('err');
  }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && S.screen==='input'){ e.preventDefault(); submit(); } });

// dev bar
document.getElementById('failT').onclick=()=>{ S.failMode=!S.failMode; syncDev(); toast(S.failMode?'저장·공유가 실패하도록 설정했어요':'실패 시뮬레이션 해제'); };
document.getElementById('shareView').onclick=()=>{ S.ref = S.ref==='share'?null:'share'; if(S.ref){ LS.trySet(K.entry,'share_link'); track('share_link_landing'); } else LS.trySet(K.entry,'direct'); S.history=[]; S.screen='landing'; render(); };
document.getElementById('reset').onclick=()=>{ Object.values(K).forEach(LS.del); location.href=location.pathname; };

/* ================= boot ================= */
// 프리뷰 도구와 이벤트 로그는 ?dev 로 열었을 때만 보여요
if(!new URLSearchParams(location.search).has('dev')){ document.querySelector('.devbar').hidden=true; document.querySelector('.log').hidden=true; }
if(S.ref==='share'){ LS.trySet(K.entry,'share_link'); track('share_link_landing'); }
else if(!LS.get(K.entry,null)) LS.trySet(K.entry,'direct');
if(savedInput()) track('revisit_landing');
render(); renderLog();
</script>
